name: Build HPP PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak proyek HPP
        run: |
          unzip HPP_PRO_Android_Project.zip -d project
          cp -r project/* .
          cp -r project/.[!.]* . 2>/dev/null || true

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Instal SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Buat APK
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: HPP-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
